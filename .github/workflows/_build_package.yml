name: _Build Package (reusable)

on:
  workflow_call:
    inputs:
      main_tweak:
        required: true
        type: string
      ipa_url:
        required: true
        type: string
      display_name:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      inject_plugins:
        required: false
        type: boolean
        default: true
      youpip:
        required: false
        type: boolean
        default: false
      ryd:
        required: false
        type: boolean
        default: false
      ytabconfig:
        required: false
        type: boolean
        default: false
      youquality:
        required: false
        type: boolean
        default: false
      youchoosequality:
        required: false
        type: boolean
        default: false
      youslider:
        required: false
        type: boolean
        default: false
      ytsilentvote:
        required: false
        type: boolean
        default: false
      ytweaks:
        required: false
        type: boolean
        default: false
      gonerino:
        required: false
        type: boolean
        default: false
      yougetcaption:
        required: false
        type: boolean
        default: false
      youspeed:
        required: false
        type: boolean
        default: false
      donteatmycontent:
        required: false
        type: boolean
        default: false
      isponsorblock:
        required: false
        type: boolean
        default: false
      alderis:
        required: false
        type: boolean
        default: false
      ythold:
        required: false
        type: boolean
        default: false

jobs:
  package:
    name: Build ${{ inputs.main_tweak }} IPA
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.3

      - name: Download Built Debs
        uses: actions/download-artifact@v8.0.1
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Copy selected Plugins to workspace
        if: inputs.inject_plugins == true
        run: |
          cp -r Plugins/*.appex ${{ github.workspace }}/

      - name: Copy YTPlus deb to workspace
        if: inputs.main_tweak == 'YTPlus'
        run: |
          cp .github/Tweaks/com_dvntm_ytlite_6_0b1_iphoneos_arm64.deb ${{ github.workspace }}/

      - name: Patch YTPlus Korean localization
        if: inputs.main_tweak == 'YTPlus'
        run: |
          KO_STRINGS=".github/Tweaks/Localizable.strings"
          if [ ! -f "$KO_STRINGS" ]; then
            echo "  ⏭️  .github/Tweaks/Localizable.strings 없음 — 원본 번역 그대로 사용"
            exit 0
          fi

          DEB="${{ github.workspace }}/com_dvntm_ytlite_6_0b1_iphoneos_arm64.deb"
          KO_STRINGS_ABS="$(pwd)/$KO_STRINGS"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          ar x "$DEB"
          DATA_MEMBER=$(ls data.tar.* | head -1)
          mkdir data_extracted
          tar -xf "$DATA_MEMBER" -C data_extracted

          TARGET=$(find data_extracted -path '*/ko.lproj/Localizable.strings' | head -1)
          if [ -z "$TARGET" ]; then
            echo "::error::YTPlus deb 안에서 ko.lproj/Localizable.strings를 찾지 못했습니다."
            exit 1
          fi
          echo "  🔤 [YTPlus] 교체 대상: $TARGET"
          cp "$KO_STRINGS_ABS" "$TARGET"

          cd data_extracted
          tar --numeric-owner --owner=0 --group=0 -cf ../data.tar .
          cd ..
          gzip -f -9 data.tar

          rm -f "$DEB"
          ar rcS "$DEB" debian-binary control.tar.* data.tar.gz

          MEMBER_COUNT=$(ar t "$DEB" | wc -l | tr -d ' ')
          DEB_SIZE=$(stat -f%z "$DEB" 2>/dev/null || stat -c%s "$DEB")
          echo "  📦 재조립된 deb: ${DEB_SIZE} bytes, 멤버 ${MEMBER_COUNT}개 ($(ar t "$DEB" | tr '\n' ' '))"
          if [ "$MEMBER_COUNT" -ne 3 ] || [ "$DEB_SIZE" -lt 1000 ]; then
            echo "::error::재조립된 YTPlus deb이 비정상입니다 (크기: ${DEB_SIZE} bytes, 멤버: ${MEMBER_COUNT}개)."
            exit 1
          fi

          rm -rf "$WORKDIR"
          echo "  ✅ [YTPlus] Localizable.strings 교체 완료"

      - name: List Downloaded Files
        run: |
          echo "Files downloaded from artifacts:"
          ls -la *.deb 2>/dev/null || echo "No .deb files found"
          ls -la *.appex 2>/dev/null || echo "No .appex files found"

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@1.2.0
        with:
          exclude_inputs: bundle_id,display_name,main_tweak,inject_plugins,youpip,ryd,ytabconfig,youquality,youchoosequality,youslider,ytsilentvote,ytweaks,gonerino,yougetcaption,youspeed,donteatmycontent,isponsorblock,alderis,ythold

      - name: Download and Validate IPA
        run: |
          IPA_URL="${{ inputs.ipa_url }}"
          IPA_URL="${IPA_URL/dl=0/dl=1}"
          echo "Downloading IPA from: $IPA_URL"

          wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" --header="User-Agent: Mozilla/5.0" "$IPA_URL" -O youtube.ipa || wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" "$IPA_URL" -O youtube.ipa

          if [ ! -f youtube.ipa ]; then
            echo "::error::Download failed: File not found"
            exit 1
          fi

          file_size=$(stat -f%z youtube.ipa 2>/dev/null || stat -c%s youtube.ipa 2>/dev/null || echo "0")
          if [ "$file_size" -lt 1000000 ]; then
            echo "::error::Downloaded file is too small ($file_size bytes)."
            head -c 500 youtube.ipa
            exit 1
          fi

          if head -c 100 youtube.ipa | grep -q "<html\|<!DOCTYPE"; then
            echo "::error::Downloaded file appears to be HTML, not an IPA."
            head -c 500 youtube.ipa
            exit 1
          fi

          if ! file youtube.ipa | grep -q "Zip archive"; then
            echo "::error::Downloaded file is not a valid Zip archive. File type: $(file youtube.ipa)"
            exit 1
          fi

          echo "✅ IPA file validated successfully!"

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted
          YT_VERSION=$(plutil -extract CFBundleVersion raw -o - ytextracted/Payload/YouTube.app/Info.plist)
          if [ -z "$YT_VERSION" ]; then
            echo "::error::Info.plist에서 CFBundleVersion을 읽지 못했습니다."
            exit 1
          fi
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV
          rm -rf ytextracted

      - name: Remove UIDesignRequiresCompatibility for Liquid Glass
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          import plistlib

          ipa = Path("youtube.ipa")
          plist_path = "Payload/YouTube.app/Info.plist"
          temp_ipa = ipa.with_suffix(".patched.ipa")
          found_app_plist = False
          removed_key = False

          with ZipFile(ipa, "r") as source, ZipFile(temp_ipa, "w") as patched:
              for item in source.infolist():
                  data = source.read(item.filename)
                  if item.filename == plist_path:
                      found_app_plist = True
                      original = data
                      info = plistlib.loads(data)
                      if "UIDesignRequiresCompatibility" in info:
                          del info["UIDesignRequiresCompatibility"]
                          plist_format = plistlib.FMT_BINARY if original.startswith(b"bplist") else plistlib.FMT_XML
                          data = plistlib.dumps(info, fmt=plist_format, sort_keys=False)
                          removed_key = True
                  patched.writestr(item, data)

          if not found_app_plist:
              temp_ipa.unlink(missing_ok=True)
              raise FileNotFoundError(f"{plist_path} was not found in youtube.ipa")

          temp_ipa.replace(ipa)
          if removed_key:
              print(f"Removed UIDesignRequiresCompatibility from {plist_path}")
          else:
              print(f"{plist_path} already had no UIDesignRequiresCompatibility key")
          PYTHON

      - name: Get Main Tweak Version and Release Notes
        env:
          INPUT_YTKACE: ${{ inputs.main_tweak == 'YTKACE' }}
          INPUT_YOUMOD: ${{ inputs.main_tweak == 'YouMod' }}
          INPUT_YTPLUS: ${{ inputs.main_tweak == 'YTPlus' }}
          INPUT_YOUPIP: ${{ inputs.youpip }}
          INPUT_RYD: ${{ inputs.ryd }}
          INPUT_YTABCONFIG: ${{ inputs.ytabconfig }}
          INPUT_YOUQUALITY: ${{ inputs.youquality }}
          INPUT_YOUCHOOSEQUALITY: ${{ inputs.youchoosequality }}
          INPUT_YOUSLIDER: ${{ inputs.youslider }}
          INPUT_YTSILENTVOTE: ${{ inputs.ytsilentvote }}
          INPUT_YTWEAKS: ${{ inputs.ytweaks }}
          INPUT_GONERINO: ${{ inputs.gonerino }}
          INPUT_YOUGETCAPTION: ${{ inputs.yougetcaption }}
          INPUT_YOUSPEED: ${{ inputs.youspeed }}
          INPUT_DONTEATMYCONTENT: ${{ inputs.donteatmycontent }}
          INPUT_ISPONSORBLOCK: ${{ inputs.isponsorblock }}
          INPUT_ALDERIS: ${{ inputs.alderis }}
          INPUT_YTHOLD: ${{ inputs.ythold }}
          INPUT_INJECT_PLUGINS: ${{ inputs.inject_plugins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_YTKACE" = "true" ]; then
            TWEAK_NAME="YTKACE"
            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/itzzace/ytkace/releases/latest \
              > release.json
            python3 .github/scripts/parse_release.py

          elif [ "$INPUT_YOUMOD" = "true" ]; then
            TWEAK_NAME="YouMod"
            curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/Tonwalter888/YouMod/releases/latest \
              > release.json
            python3 .github/scripts/parse_release.py

          elif [ "$INPUT_YTPLUS" = "true" ]; then
            TWEAK_NAME="YTPlus"
            YTPLUS_DEB=$(ls .github/Tweaks/com_dvntm_ytlite_*.deb 2>/dev/null | head -1)
            if [ -z "$YTPLUS_DEB" ]; then
              echo "::error::YTPlus deb not found in .github/Tweaks/"
              exit 1
            fi
            YTPLUS_VERSION=$(basename "$YTPLUS_DEB" | sed 's/com_dvntm_ytlite_//' | sed 's/_iphoneos.*//' | sed 's/_/./g')
            echo "{}" > release.json
            TWEAK_VERSION_OVERRIDE="$YTPLUS_VERSION" python3 .github/scripts/parse_release.py

          else
            TWEAK_NAME="YouTube"
            echo "{}" > release.json
            python3 .github/scripts/parse_release.py
          fi

          echo "TWEAK_NAME=$TWEAK_NAME" >> $GITHUB_ENV

      - name: Install cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Set Release Title
        run: |
          RELEASE_TITLE="${{ env.TWEAK_NAME }}_v${{ env.TWEAK_VERSION }}_v${{ env.YT_VERSION }}"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          for appex in IntentsExtension.appex NotificationContentExtension.appex NotificationServiceExtension.appex OpenYoutubeSafariExtension.appex ShareExtension.appex WidgetKitExtension.appex; do
            [ -e "$appex" ] && tweaks="$tweaks $appex"
          done
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o "${{ env.RELEASE_TITLE }}.ipa" -uesf $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Verify Liquid Glass plist change in IPA
        run: |
          python3 - <<'PYTHON'
          from zipfile import ZipFile
          import plistlib

          ipa = "${{ env.RELEASE_TITLE }}.ipa"
          plist_path = "Payload/YouTube.app/Info.plist"
          with ZipFile(ipa) as archive:
              info = plistlib.loads(archive.read(plist_path))
          if "UIDesignRequiresCompatibility" in info:
              raise SystemExit("::error::UIDesignRequiresCompatibility is still present in the built IPA")
          print(f"Verified: UIDesignRequiresCompatibility is absent from {plist_path}")
          PYTHON

      - name: Collect Main Tweak Deb for Release
        env:
          INPUT_YTKACE: ${{ inputs.main_tweak == 'YTKACE' }}
          INPUT_YOUMOD: ${{ inputs.main_tweak == 'YouMod' }}
        run: |
          MAIN_DEBS=""

          if [ "$INPUT_YTKACE" = "true" ]; then
            for f in com.itzzace.ytkace_*_roothide.deb com.itzzace.ytkace_*_rootless.deb; do
              [ -f "$f" ] && MAIN_DEBS="$MAIN_DEBS $f" && echo "✅ Found: $f"
            done
          elif [ "$INPUT_YOUMOD" = "true" ]; then
            for f in youmod_*_iphoneos-arm.deb; do
              [ -f "$f" ] && MAIN_DEBS="$MAIN_DEBS $f" && echo "✅ Found: $f"
            done
          fi

          if [ -n "$MAIN_DEBS" ]; then
            echo "MAIN_TWEAK_DEBS=$MAIN_DEBS" >> $GITHUB_ENV
          else
            echo "⚠️ No matching tweak deb found. Will upload IPA only."
            echo "MAIN_TWEAK_DEBS=" >> $GITHUB_ENV
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_TITLE }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            i=2
            while gh release view "${TAG}-${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null
            do
              i=$(( i + 1 ))
            done
            TAG="${TAG}-${i}"
          fi

          RELEASE_FILES="${{ env.RELEASE_TITLE }}.ipa"
          if [ -n "${{ env.MAIN_TWEAK_DEBS }}" ]; then
            RELEASE_FILES="$RELEASE_FILES ${{ env.MAIN_TWEAK_DEBS }}"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes-file release_notes.md \
            $RELEASE_FILES

      - name: Job Summary - Build Complete
        run: echo -e '### 🛠️ Build IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Release Link
        run: |
          echo -e "### 🚀 Release\n\nRelease has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup
        run: |
          echo -e "### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml" >> $GITHUB_STEP_SUMMARY
