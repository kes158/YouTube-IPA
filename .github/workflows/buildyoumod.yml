name: Build YouTube IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      YTKACE:
        description: "Integrate YTKace"
        default: true
        required: true
        type: boolean

      YouMod:
        description: "Integrate YouMod"
        default: false
        required: false
        type: boolean

      YTPlus:
        description: "Integrate YTPlus"
        default: false
        required: false
        type: boolean

      YouMod_Repository:
        description: "YouMod source repository (owner/repo)"
        default: "kes158/YouMod"
        required: false
        type: string

      YouMod_Ref:
        description: "YouMod source branch or tag"
        default: "Edit-Settings"
        required: false
        type: string

      YouPiP:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      RYD:
        description: "Integrate Return YouTube Dislikes"
        default: true
        required: false
        type: boolean

      YTABConfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      YouQuality:
        description: "Integrate YouQuality"
        default: false
        required: false
        type: boolean

      YouChooseQuality:
        description: "Integrate YouChooseQuality"
        default: false
        required: false
        type: boolean

      YouSlider:
        description: "Integrate YouSlider"
        default: false
        required: false
        type: boolean

      YTSilentVote:
        description: "Integrate YTSilentVote"
        default: false
        required: false
        type: boolean

      YTweaks:
        description: "Integrate YTweaks"
        default: true
        required: false
        type: boolean

      Gonerino:
        description: "Integrate Gonerino"
        default: true
        required: false
        type: boolean

      YouGetCaption:
        description: "Integrate YouGetCaption"
        default: true
        required: false
        type: boolean

      YouSpeed:
        description: "Integrate YouSpeed"
        default: false
        required: false
        type: boolean

      DontEatMyContent:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      iSponsorBlock:
        description: "Integrate iSponsorBlock"
        default: false
        required: false
        type: boolean

      Alderis:
        description: "Integrate Alderis (Color Picker)"
        default: true
        required: false
        type: boolean

      Inject_Plugins:
        description: "Inject all Plugins (IntentsExtension, NotificationContent, NotificationService, OpenYoutubeSafari, Share, WidgetKit)"
        default: true
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      youpro: false
      youmod: ${{ inputs.YouMod }}
      youmod_repository: ${{ inputs.YouMod_Repository }}
      youmod_ref: ${{ inputs.YouMod_Ref }}
      isponsorblock: ${{ inputs.iSponsorBlock }}
      demc: ${{ inputs.DontEatMyContent }}
      youpip: ${{ inputs.YouPiP }}
      ytuhd: false
      ryd: ${{ inputs.RYD }}
      ytabconfig: ${{ inputs.YTABConfig }}
      youquality: ${{ inputs.YouQuality }}
      youslider: ${{ inputs.YouSlider }}
      ytsilentvote: ${{ inputs.YTSilentVote }}
      ytweaks: ${{ inputs.YTweaks }}
      youchoose: ${{ inputs.YouChooseQuality }}
      gonerino: ${{ inputs.Gonerino }}
      yougetcaption: ${{ inputs.YouGetCaption }}
      youspeed: ${{ inputs.YouSpeed }}
      youmute: false
      youloop: false
      opensafari: false
      alderis: ${{ inputs.Alderis }}
      ytkace: ${{ inputs.YTKACE }}

  package:
    name: Build YouMod IPA
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.3

      - name: Download Built Debs
        uses: actions/download-artifact@v8.0.1
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: Copy selected Plugins to workspace
        if: inputs.Inject_Plugins == true
        run: |
          cp -r Plugins/*.appex ${{ github.workspace }}/

      - name: Copy YTPlus deb to workspace
        if: inputs.YTPlus == true
        run: |
          cp .github/Tweaks/com_dvntm_ytlite_6_0b1_iphoneos_arm64.deb ${{ github.workspace }}/

      - name: List Downloaded Files
        run: |
          echo "Files downloaded from artifacts:"
          ls -la *.deb 2>/dev/null || echo "No .deb files found"
          ls -la *.appex 2>/dev/null || echo "No .appex files found"

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@1.2.0
        with:
          exclude_inputs: bundle_id,display_name,YTKACE,YouMod,YTPlus,YouPiP,RYD,YTABConfig,YouQuality,YouChooseQuality,YouSlider,YTSilentVote,YTweaks,Gonerino,YouGetCaption,YouSpeed,DontEatMyContent,iSponsorBlock,Alderis,Inject_Plugins

      - name: Download and Validate IPA
        run: |
          IPA_URL="${{ inputs.ipa_url }}"
          IPA_URL="${IPA_URL/dl=0/dl=1}"
          echo "Downloading IPA from: $IPA_URL"

          wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" --header="User-Agent: Mozilla/5.0" "$IPA_URL" -O youtube.ipa || wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" "$IPA_URL" -O youtube.ipa

          if [ ! -f youtube.ipa ]; then
            echo "::error::Download failed: File not found"
            exit 1
          fi

          file_size=$(stat -f%z youtube.ipa 2>/dev/null || stat -c%s youtube.ipa 2>/dev/null || echo "0")
          if [ "$file_size" -lt 1000000 ]; then
            echo "::error::Downloaded file is too small ($file_size bytes). This likely means the URL is invalid or requires authentication."
            echo "File content preview:"
            head -c 500 youtube.ipa
            exit 1
          fi

          file_type=$(file --mime-type -b youtube.ipa)
          echo "File type: $file_type"
          echo "File size: $file_size bytes"

          if head -c 100 youtube.ipa | grep -q "<html\|<!DOCTYPE"; then
            echo "::error::Downloaded file appears to be HTML, not an IPA. The URL likely points to a webpage instead of the actual IPA file."
            echo "HTML preview:"
            head -c 500 youtube.ipa
            exit 1
          fi

          if ! file youtube.ipa | grep -q "Zip archive"; then
            echo "::error::Downloaded file is not a valid Zip archive. File type: $(file youtube.ipa)"
            exit 1
          fi

          echo "✅ IPA file validated successfully!"

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted
          YT_VERSION=$(plutil -extract CFBundleVersion raw -o - ytextracted/Payload/YouTube.app/Info.plist)
          if [ -z "$YT_VERSION" ]; then
            echo "::error::Info.plist에서 CFBundleVersion을 읽지 못했습니다."
            exit 1
          fi
          echo "YT_VERSION=$YT_VERSION" >> $GITHUB_ENV
          rm -rf ytextracted

      - name: Get Main Tweak Version and Release Notes
        env:
          INPUT_YTKACE: ${{ inputs.YTKACE }}
          INPUT_YOUMOD: ${{ inputs.YouMod }}
          INPUT_YTPLUS: ${{ inputs.YTPlus }}
          INPUT_YOUPIP: ${{ inputs.YouPiP }}
          INPUT_RYD: ${{ inputs.RYD }}
          INPUT_YTABCONFIG: ${{ inputs.YTABConfig }}
          INPUT_YOUQUALITY: ${{ inputs.YouQuality }}
          INPUT_YOUCHOOSEQUALITY: ${{ inputs.YouChooseQuality }}
          INPUT_YOUSLIDER: ${{ inputs.YouSlider }}
          INPUT_YTSILENTVOTE: ${{ inputs.YTSilentVote }}
          INPUT_YTWEAKS: ${{ inputs.YTweaks }}
          INPUT_GONERINO: ${{ inputs.Gonerino }}
          INPUT_YOUGETCAPTION: ${{ inputs.YouGetCaption }}
          INPUT_YOUSPEED: ${{ inputs.YouSpeed }}
          INPUT_DONTEATMYCONTENT: ${{ inputs.DontEatMyContent }}
          INPUT_ISPONSORBLOCK: ${{ inputs.iSponsorBlock }}
          INPUT_ALDERIS: ${{ inputs.Alderis }}
          INPUT_INJECT_PLUGINS: ${{ inputs.Inject_Plugins }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$INPUT_YTKACE" = "true" ]; then
            TWEAK_NAME="YTKACE"
            RELEASE_JSON=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/itzzace/ytkace/releases/latest)
            TWEAK_VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; v=json.load(sys.stdin).get('tag_name','unknown'); print(v.lstrip('v'))")
            RELEASE_NOTES=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")

          elif [ "$INPUT_YOUMOD" = "true" ]; then
            TWEAK_NAME="YouMod"
            RELEASE_JSON=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/Tonwalter888/YouMod/releases/latest)
            TWEAK_VERSION=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; v=json.load(sys.stdin).get('tag_name','unknown'); print(v.lstrip('v'))")
            RELEASE_NOTES=$(echo "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('body',''))")

          elif [ "$INPUT_YTPLUS" = "true" ]; then
            TWEAK_NAME="YTPlus"
            YTPLUS_DEB=$(ls .github/Tweaks/com_dvntm_ytlite_*.deb 2>/dev/null | head -1)
            if [ -z "$YTPLUS_DEB" ]; then
              echo "::error::YTPlus deb not found in .github/Tweaks/"
              exit 1
            fi
            TWEAK_VERSION=$(basename "$YTPLUS_DEB" | sed 's/com_dvntm_ytlite_//' | sed 's/_iphoneos.*//' | sed 's/_/./g')

            # 주입된 트윅/플러그인 목록 생성
            TWEAKS_LIST=""
            [ "$INPUT_YOUPIP" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouPiP"
            [ "$INPUT_RYD" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- Return YouTube Dislikes"
            [ "$INPUT_YTABCONFIG" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YTABConfig"
            [ "$INPUT_YOUQUALITY" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouQuality"
            [ "$INPUT_YOUCHOOSEQUALITY" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouChooseQuality"
            [ "$INPUT_YOUSLIDER" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouSlider"
            [ "$INPUT_YTSILENTVOTE" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YTSilentVote"
            [ "$INPUT_YTWEAKS" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YTweaks"
            [ "$INPUT_GONERINO" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- Gonerino"
            [ "$INPUT_YOUGETCAPTION" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouGetCaption"
            [ "$INPUT_YOUSPEED" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- YouSpeed"
            [ "$INPUT_DONTEATMYCONTENT" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- DontEatMyContent"
            [ "$INPUT_ISPONSORBLOCK" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- iSponsorBlock"
            [ "$INPUT_ALDERIS" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- Alderis"
            [ "$INPUT_INJECT_PLUGINS" = "true" ] && TWEAKS_LIST="$TWEAKS_LIST\n- Plugins (IntentsExtension, NotificationContent, NotificationService, OpenYoutubeSafari, Share, WidgetKit)"

            RELEASE_NOTES="# YTPlus_v${TWEAK_VERSION}_v${{ env.YT_VERSION }}\n\n## 포함된 트윅 및 플러그인\n- YTPlus v${TWEAK_VERSION}${TWEAKS_LIST}"

          else
            TWEAK_NAME="YouTube"
            TWEAK_VERSION="unknown"
            RELEASE_NOTES=""
          fi

          echo "TWEAK_NAME=$TWEAK_NAME" >> $GITHUB_ENV
          echo "TWEAK_VERSION=$TWEAK_VERSION" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          printf "%b" "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Install cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Set Release Title
        run: |
          RELEASE_TITLE="${{ env.TWEAK_NAME }}_v${{ env.TWEAK_VERSION }}_v${{ env.YT_VERSION }}"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_ENV

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          for appex in IntentsExtension.appex NotificationContentExtension.appex NotificationServiceExtension.appex OpenYoutubeSafariExtension.appex ShareExtension.appex WidgetKitExtension.appex; do
            [ -e "$appex" ] && tweaks="$tweaks $appex"
          done
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o "${{ env.RELEASE_TITLE }}.ipa" -uesf $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Collect Main Tweak Deb for Release
        env:
          INPUT_YTKACE: ${{ inputs.YTKACE }}
          INPUT_YOUMOD: ${{ inputs.YouMod }}
        run: |
          MAIN_DEBS=""

          if [ "$INPUT_YTKACE" = "true" ]; then
            for f in com.itzzace.ytkace_*_roothide.deb com.itzzace.ytkace_*_rootless.deb; do
              [ -f "$f" ] && MAIN_DEBS="$MAIN_DEBS $f" && echo "✅ Found: $f"
            done
          elif [ "$INPUT_YOUMOD" = "true" ]; then
            for f in youmod_*_iphoneos-arm.deb; do
              [ -f "$f" ] && MAIN_DEBS="$MAIN_DEBS $f" && echo "✅ Found: $f"
            done
          fi

          if [ -n "$MAIN_DEBS" ]; then
            echo "MAIN_TWEAK_DEBS=$MAIN_DEBS" >> $GITHUB_ENV
          else
            echo "⚠️ No matching tweak deb found. Will upload IPA only."
            echo "MAIN_TWEAK_DEBS=" >> $GITHUB_ENV
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ env.RELEASE_TITLE }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            i=2
            while gh release view "${TAG}-${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
              i=$(( i + 1 ))
            done
            TAG="${TAG}-${i}"
          fi

          RELEASE_FILES="${{ env.RELEASE_TITLE }}.ipa"
          if [ -n "${{ env.MAIN_TWEAK_DEBS }}" ]; then
            RELEASE_FILES="$RELEASE_FILES ${{ env.MAIN_TWEAK_DEBS }}"
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ env.RELEASE_TITLE }}" \
            --notes "${{ env.RELEASE_NOTES }}" \
            $RELEASE_FILES

      - name: Job Summary - Build Complete
        run: echo -e '### 🛠️ Build YouMod IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Release Link
        run: |
          echo -e "### 🚀 Release\n\nRelease has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup
        run: |
          echo -e "### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml" >> $GITHUB_STEP_SUMMARY
